return`<div class="c"><b>${h(n)}</b><label>Company notes<textarea data-co="${h(n)}" rows="5" placeholder="Things to remember about this company">${h(db.coNotes[n.toLowerCase()]||'')}</textarea></label></div><h3>Jobs here</h3>${as.sort((x,y)=>rank(x)-rank(y)).map(a=>`<div class="c" data-a="open" data-id="${a.id}"><div class="row sp"><b>${dot(a)}${h(a.title&&!a.title.startsWith('http')?a.title:'(untitled)')}</b>${chip(a.status)}</div><div class="mu">${a.appDate?'Applied '+fd(a.appDate):'Not applied yet'}${a.ref?' · '+h(a.ref):''}</div></div>`).join('')}<div class="c"><button data-a="add" data-t="apps" data-org="${h(n)}">+ Add another job at ${h(n)}</button></div><h3>People here</h3>${cs.map(cr).join('')||empty('No contacts yet.')}`},
detail(){const a=db.apps.find(x=>x.id===did);if(!a)return empty('Job not found.');const r=db.resumes.find(x=>x.id===a.resumeId),cs=db.contacts.filter(c=>c.appId===a.id),ms=db.meetings.filter(m=>m.appId===a.id).sort((x,y)=>x.start<y.start?-1:1);
const g=['general','behavioral'];const t=[a.title,a.type,a.org].join(' ');MAP.forEach(([x,k])=>x.test(t)&&g.push(k));g.push('ask');if(/offer/i.test(a.status))g.push('neg');
return`<div class="c"><div class="row sp"><b>${dot(a)}${h(nm.apps(a))}</b><button class="g" data-a="ed" data-t="apps" data-id="${a.id}">Edit</button></div>
<label>Status<select data-st="${a.id}">${opts('sel:status',a.status).replace('<option value="">—</option>','')}</select></label><label>Interest<select data-it="${a.id}">${opts('sel:interest',a.interest||'Undecided').replace('<option value="">—</option>','')}</select></label>
${kv('Applied',fd(a.appDate))}${kv('Days active',days(a))}${kv('Type',h(a.type))}${kv('Work area',h(a.area))}${kv('Location',h(a.location))}${kv('Req #',h(a.ref))}${kv('My application',a.appUrl?`<a href="${h(a.appUrl)}" target="_blank" rel="noopener">Check status</a>`:'')}${kv('Posting',a.url?`<a href="${h(a.url)}" target="_blank" rel="noopener">Open</a>`:'')}${kv('Resume',r?h(nm.resumes(r)):'')}${kv('SkillBridge',a.skillbridge?'Yes':'')}${kv('Pay',(p=>p[0]!==''?(p[0]===p[1]?money(p[0]):money(p[0])+' – '+money(p[1]))+(a.plan?' ('+a.plan+(a.grade?'-'+a.grade:'')+(a.step?' step '+a.step:'')+', Fort Meade)':''):'')(pays(a)))}${kv('Signing bonus',a.bonus?money(a.bonus):'')}${kv('First-year total',a.bonus&&avg(a)!==''?money(avg(a)+ +a.bonus):'')}${kv('Decision',h(a.decision))}${kv('Decision date',fd(a.decisionDate))}${kv('Follow up by',fd(a.followUp))}${kv('Found through',h(a.source))}${a.notes?`<p class="mu" style="white-space:pre-wrap">${h(a.notes)}</p>`:''}</div>
${a.org?`<div class="c"><label>Company notes — ${h(a.org)}<textarea data-co="${h(a.org)}" rows="4" placeholder="Things to remember about this company">${h(db.coNotes[a.org.toLowerCase()]||'')}</textarea></label><button class="g" data-a="co" data-n="${h(a.org)}">All jobs at ${h(a.org)} ›</button></div>`:''}<h3>People</h3>${cs.map(cr).join('')||empty('No contacts yet.')}<div class="c"><button data-a="add" data-t="contacts" data-app="${a.id}">+ Add contact</button></div>
<h3>Meetings</h3>${ms.map(mr).join('')||empty('No meetings yet.')}<div class="c"><button data-a="add" data-t="meetings" data-app="${a.id}">+ Add meeting / event</button></div>
<h3>Interview prep</h3><div class="c mu">Questions picked for this job. Tap one to write your answer (Situation, Task, Action, Result). It saves automatically.</div>
${g.map(k=>`<div class="c"><b>${GL[k]}</b>${QB[k].map(x=>{const key=a.id+'|'+x,v=db.answers[key]||'';return`<details><summary>${v?'✓ ':''}${h(x)}</summary><textarea data-k="${h(key)}" rows="5" placeholder="Your answer">${h(v)}</textarea></details>`}).join('')}</div>`).join('')}`},
meets(){const u=upc(),p=db.meetings.filter(m=>!u.includes(m)).sort((a,b)=>a.start<b.start?1:-1);return`<h3>Upcoming</h3>${u.map(mr).join('')||empty('Nothing scheduled.')}<h3>Past</h3>${p.map(mr).join('')||empty('No past meetings.')}<button class="fab" data-a="add" data-t="meetings">+ Add meeting / event</button>`},
people(){const by={},mt={};db.contacts.forEach(c=>by[c.role||'Other']=(by[c.role||'Other']||0)+1);db.meetings.forEach(m=>m.contactId&&(mt[m.contactId]=(mt[m.contactId]||0)+1));
const top=Object.entries(mt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([i,n])=>{const c=db.contacts.find(x=>x.id===i);return c?h(c.name)+' ('+n+')':''}).filter(Boolean);
return`<div class="mini">${Object.entries(by).map(([k,n])=>`<div><b>${n}</b><span>${h(k)}</span></div>`).join('')||'<div><b>0</b><span>Contacts</span></div>'}</div><div class="c mu">Most engaged: ${top.join(', ')||'add meetings linked to a contact to see this'}</div><div class="sf"><input id="q" placeholder="Search contacts" value="${h(q)}"></div><div id="list">${pl()}</div><button class="fab" data-a="add" data-t="contacts">+ Add contact</button>`},
resumes(){return(db.resumes.map(r=>{const n=db.apps.filter(a=>a.resumeId===r.id).length;return`<div class="c"><div class="row sp"><b>${h(nm.resumes(r))}</b><button class="g" data-a="ed" data-t="resumes" data-id="${r.id}">Edit</button></div><div class="mu">${fd(r.date)} · used for ${n} job${n==1?'':'s'}</div>${r.target?`<div>${h(r.target)}</div>`:''}${r.notes?`<div class="mu">${h(r.notes)}</div>`:''}${r.link?`<a href="${h(r.link)}" target="_blank" rel="noopener">Open file</a>`:''}</div>`}).join('')||empty('Add each resume version here, then pick it on each job.'))+'<button class="fab" data-a="add" data-t="resumes">+ Add resume</button>'},
report(){rf=rf||(()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)})();return`<div class="c"><label>Week starting<input type="date" id="rf" value="${rf}"></label><div id="rl">${rl()}</div></div>`},
settings(){const lists=Object.keys(DEF).filter(k=>!['interest','plan'].includes(k));return`<div class="c"><b>Back up and download</b><p class="mu">All data lives only on this iPhone. Download a backup regularly and save it to Files or iCloud Drive.</p><div class="row"><button data-a="bk">Full backup (.json)</button></div><div class="row" style="margin-top:8px">${Object.keys(F).map(t=>`<button class="g" data-a="csv" data-t="${t}">${LB[t]}s .csv</button>`).join('')}<button class="g" data-a="icsall">All meetings .ics</button></div></div>
<div class="c"><b>Restore or import</b><p class="mu">Choose a backup .json file. This replaces what is in the app now.</p><input type="file" id="imp" accept=".json,application/json"></div>
<div class="c"><button data-a="go" data-v="report">Weekly report (for unemployment office)</button></div>
<div class="c"><details><summary><b>Edit dropdown lists</b></summary><p class="mu">One option per line.</p>${lists.map(k=>`<label>${k}<textarea id="l_${k}" rows="5">${h(L(k).join('\n'))}</textarea></label>`).join('')}<button data-a="sl">Save lists</button></details></div>
<div class="c"><b>Privacy</b><p class="mu">No account, no cloud, no tracking. Never enter classified or controlled information. For a classified-space meeting, choose that type and leave the place blank: the calendar entry then shows only “Secure facility”.</p></div>
<div class="c"><button class="bad" data-a="wipe">Erase everything</button></div>`}};
const cr=c=>{const a=db.apps.find(x=>x.id===c.appId);return`<div class="c"><div class="row sp"><b>${h(c.name)}</b><button class="g" data-a="ed" data-t="contacts" data-id="${c.id}">Edit</button></div><div class="mu">${h(c.role)}${c.org?' · '+h(c.org):a?' · '+h(a.org):''}</div><div class="row">${c.email?`<a href="mailto:${h(c.email)}">${h(c.email)}</a>`:''}${c.phone?`<a href="tel:${h(c.phone)}">${h(c.phone)}</a>`:''}${c.linkedin?`<a href="${h(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`:''}</div>${c.notes&&c.notes!==c.name?`<div class="mu">${h(c.notes.slice(0,200))}</div>`:''}</div>`};
const pst=()=>{const v=db.apps.map(avg).filter(x=>x!=='').sort((a,b)=>a-b);if(!v.length)return['–','–','–'];const m=v.length>>1,c={};v.forEach(x=>{const k=Math.round(x/5e3)*5e3;c[k]=(c[k]||0)+1});return[money(Math.round(v.reduce((a,b)=>a+b)/v.length)),money(v.length%2?v[m]:(v[m-1]+v[m])/2),money(+Object.keys(c).sort((a,b)=>c[b]-c[a]||a-b)[0])]};
const jl=()=>{const s=q.toLowerCase(),g={};db.apps.filter(a=>(!sf||a.status===sf)&&(!fi||(a.interest||'Undecided')===fi)&&(!s||[a.org,a.title,a.notes,a.ref].join(' ').toLowerCase().includes(s))).forEach(a=>(g[a.org||'(no company)']??=[]).push(a));
return Object.keys(g).sort((x,y)=>Math.min(...g[x].map(rank))-Math.min(...g[y].map(rank))||x.localeCompare(y)).map(k=>`<div class="c"><div class="row sp" data-a="co" data-n="${h(k)}"><b>${h(k)}</b><span class="mu">${g[k].length} job${g[k].length>1?'s':''} ›</span></div>${g[k].sort((x,y)=>rank(x)-rank(y)).map(a=>`<div class="kv" data-a="open" data-id="${a.id}" style="align-items:center"><span style="color:var(--ink)">${dot(a)}${h(a.title&&!a.title.startsWith('http')?a.title:'(untitled)')}</span>${chip(a.status)}</div>`).join('')}</div>`).join('')||empty('No jobs match. Tap “+ Add new job”.')};
const pl=()=>{const s=q.toLowerCase();return db.contacts.filter(c=>!s||[c.name,c.email,c.notes].join(' ').toLowerCase().includes(s)).sort((a,b)=>a.name>b.name?1:-1).map(cr).join('')||empty('No contacts yet.')};
const rl=()=>{const e=new Date(rf+'T00:00');e.setDate(e.getDate()+6);const r=db.apps.filter(a=>a.appDate>=rf&&a.appDate<=iso(e));return`<p class="mu">${fd(rf)} – ${fd(iso(e))}: ${r.length} applications</p>`+r.map(a=>`<div class="kv"><span>${fd(a.appDate)}</span><span>${h(nm.apps(a))}</span></div>`).join('')+`<p><button data-a="cp">Copy list</button></p>`};
function draw(){const M=['home','jobs','meets','people','resumes'],T={home:'Home',jobs:'Jobs',meets:'Calendar',people:'Contacts',resumes:'Resumes',detail:'Job',co:'Company',settings:'Data & settings',report:'Weekly report'};
$('#hd').innerHTML=M.includes(view)?`<h1>${T[view]}</h1><button class="g" data-a="go" data-v="settings">Settings</button>`:`<button class="g" data-a="back">‹ Back</button><h1>${T[view]}</h1><span style="width:60px"></span>`;
$('#nav').innerHTML=M.map(v=>`<button data-a="go" data-v="${v}" class="${v===view||(view==='detail'||view==='co')&&v==='jobs'?'on':''}">${T[v]}</button>`).join('');$('#app').innerHTML=V[view]()}
const A={go:d=>{view=d.v;q='';sf='';fi='';scrollTo(0,0);draw()},back:()=>{view=view==='detail'||view==='co'?'jobs':view==='report'?'settings':'home';draw()},open:d=>{did=d.id;view='detail';scrollTo(0,0);draw()},x:()=>$('#modal').innerHTML='',
add:d=>{const ap=db.apps.find(x=>x.id===d.app),o=d.org||ap?.org||'';edit(d.t,'',d.t==='apps'?{appDate:iso(new Date()),status:L('status')[1]||'',interest:'Undecided',org:o}:d.t==='meetings'?{mins:30,appId:d.app||'',cat:L('cat')[0]}:{appId:d.app||'',org:o})},
ed:d=>edit(d.t,d.id),co:d=>{co=d.n;view='co';scrollTo(0,0);draw()},fi:d=>{fi=d.v;draw()},plus:()=>$('#modal').innerHTML=`<div class="ov"><div class="sh"><div class="bar"><b>Add new</b><button class="g" data-a="x">Cancel</button></div>${[['apps','Job'],['resumes','Resume'],['meetings','Meeting or event'],['contacts','Contact']].map(([t,l])=>`<p><button style="width:100%" data-a="add" data-t="${t}">${l}</button></p>`).join('')}</div></div>`,
sv:async d=>{const r=d.id?db[d.t].find(x=>x.id===d.id):{id:uid()};F[d.t].forEach(([k,,ty])=>{const e=$('#f_'+k);r[k]=ty==='chk'?e.checked:ty==='number'?(e.value===''?'':+e.value):e.value});if(d.t==='contacts'&&!r.org){const ap=db.apps.find(x=>x.id===r.appId);if(ap)r.org=ap.org}if(d.t==='meetings'&&!r.start)return alert('Pick a date and time first.');if(!d.id)db[d.t].push(r);await save();$('#modal').innerHTML='';draw()},
del:async d=>{if(!confirm('Delete this record? This cannot be undone.'))return;db[d.t]=db[d.t].filter(x=>x.id!==d.id);if(d.t==='apps'){db.meetings=db.meetings.filter(m=>m.appId!==d.id);db.contacts.forEach(c=>{if(c.appId===d.id)c.appId=''});if(view==='detail')view='jobs'}await save();$('#modal').innerHTML='';draw()},
ics:d=>dl('meeting.ics',icsOf([db.meetings.find(m=>m.id===d.id)]),'text/calendar'),icsall:()=>dl('job-meetings.ics',icsOf(db.meetings.filter(m=>m.start)),'text/calendar'),
bk:()=>dl('job-tracker-backup-'+iso(new Date())+'.json',JSON.stringify(db,null,1),'application/json'),
csv:d=>{const f=F[d.t],x=d.t==='apps';dl(d.t+'-'+iso(new Date())+'.csv','\ufeff'+csv([f.map(c=>c[1]).concat(x?['Days active','Avg pay']:[]),...db[d.t].map(r=>f.map(([k,,ty])=>ty.startsWith('ref:')?(o=>o?nm[ty.slice(4)](o):'')(db[ty.slice(4)].find(y=>y.id===r[k])):r[k]).concat(x?[days(r),avg(r)]:[]))]),'text/csv')},
sl:async()=>{Object.keys(DEF).forEach(k=>$('#l_'+k)&&(db.cfg[k]=$('#l_'+k).value.split('\n').map(s=>s.trim()).filter(Boolean)));await save();alert('Lists saved.')},
cp:()=>{const e=new Date(rf+'T00:00');e.setDate(e.getDate()+6);navigator.clipboard?.writeText(db.apps.filter(a=>a.appDate>=rf&&a.appDate<=iso(e)).map(a=>fd(a.appDate)+' - '+nm.apps(a)).join('\n'));alert('Copied.')},
wipe:async()=>{if(confirm('Erase ALL data on this phone? Download a backup first.')&&confirm('Really erase everything?')){db=fresh();await save();view='home';draw()}}};
const fresh=()=>({apps:[],contacts:[],meetings:[],resumes:[],answers:{},coNotes:{},cfg:structuredClone(DEF)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#list').innerHTML=view==='jobs'?jl():pl()}if(e.target.id==='rf'){rf=e.target.value;$('#rl').innerHTML=rl()}});
document.addEventListener('change',async e=>{const t=e.target;
if(t.id==='sfl'){sf=t.value;$('#list').innerHTML=jl()}
else if(t.dataset.st){db.apps.find(a=>a.id===t.dataset.st).status=t.value;await save()}else if(t.dataset.it){db.apps.find(a=>a.id===t.dataset.it).interest=t.value;await save();draw()}else if(t.dataset.co){db.coNotes[t.dataset.co.toLowerCase()]=t.value;await save()}
else if(t.dataset.k){db.answers[t.dataset.k]=t.value;await save();t.closest('details').querySelector('summary').textContent=(t.value?'✓ ':'')+t.dataset.k.split('|').slice(1).join('|')}
else if(t.id==='imp'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!Array.isArray(j.apps))throw 0;if(!confirm('Replace everything in the app with this file?'))return;db={...fresh(),...j};db.cfg={...structuredClone(DEF),...(j.cfg||{})};await save();view='home';draw()}catch{alert('That file is not a Job Tracker backup.')}}});
(async()=>{db=(await load())||fresh();db.cfg||={};for(const k in DEF)db.cfg[k]??=DEF[k].slice();db.coNotes||={};db.answers||={};navigator.storage?.persist?.();draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
